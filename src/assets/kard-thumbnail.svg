<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <radialGradient id="connectingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Off-White Background matching KARD webapp -->
  <rect width="1200" height="675" fill="#fbfbfc" />

  <!-- Subtle grid pattern in background for sleek presentation -->
  <g opacity="0.04" stroke="#000000" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- KARD Title & Subtitle -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="115" font-size="64" font-weight="900" fill="#e24a38" letter-spacing="8">KARD</text>
    <text x="600" y="152" font-size="16" font-weight="400" fill="#6b7280" letter-spacing="0.5">The multiplayer card game</text>
  </g>

  <!-- Card 1: Join or Create a Game -->
  <g filter="url(#cardShadow)">
    <rect x="360" y="195" width="480" height="215" rx="16" fill="#ffffff" stroke="#f0f1f3" stroke-width="1" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="390" y="245" font-size="20" font-weight="700" fill="#1f2937">Join or Create a Game</text>

    <!-- Name input box -->
    <rect x="390" y="270" width="420" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="406" y="299" font-size="15" fill="#9ca3af">Your name</text>

    <!-- Room name input & Create Room button -->
    <rect x="390" y="330" width="280" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="406" y="359" font-size="15" fill="#9ca3af">Room name</text>

    <rect x="682" y="330" width="128" height="46" rx="8" fill="#e24a38" />
    <text x="746" y="359" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Create Room</text>
  </g>

  <!-- Card 2: Available Rooms -->
  <g filter="url(#cardShadow)">
    <rect x="360" y="435" width="480" height="135" rx="16" fill="#ffffff" stroke="#f0f1f3" stroke-width="1" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="390" y="485" font-size="20" font-weight="700" fill="#1f2937">Available Rooms</text>
    <text x="390" y="525" font-size="15" font-style="italic" fill="#9ca3af">No rooms available. Create one!</text>
  </g>

  <!-- Status Indicator: Connecting... -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="560" cy="608" r="8" fill="url(#connectingGlow)" />
    <circle cx="560" cy="608" r="5" fill="#e24a38" />
    <text x="575" y="613" font-size="14" fill="#6b7280">Connecting...</text>
  </g>
</svg>
